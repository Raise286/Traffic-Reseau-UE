version: '3.8'

services:
  # ========================================
  # BASE DE DONNÉES POSTGRESQL
  # ========================================
  db:
    image: postgres:15-alpine
    container_name: webhook-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: webhook_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Le healthcheck s'assure que la base est prête avant de lancer l'API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # TON API WEBHOOK ENGINE
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Ces variables surchargent ton application.properties
      - DB_HOST=db      # 'db' correspond au nom du service au-dessus
      - DB_PORT=5432
      - DB_NAME=webhook_db
      - DB_USER=postgres
      - DB_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy # L'API attendra que la DB soit prête

# Persistance des données de la base de données
volumes:
  postgres_data: